<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Contact — Loan EMI Calculator</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; line-height: 1.6; color: #333; }
      header { background: #fff; border-bottom: 1px solid #e0e0e0; padding: 1rem 0; }
      nav { max-width: 1200px; margin: 0 auto; padding: 0 1rem; }
      nav a { margin-right: 2rem; text-decoration: none; color: #666; }
      nav a:hover { color: #7c3aed; }
      main { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
      h1 { margin-bottom: 1rem; color: #1a1a1a; }
      h2 { margin-top: 2rem; margin-bottom: 1rem; color: #333; }
      p { margin-bottom: 1rem; }
      form { margin-top: 2rem; }
      label { display: block; margin-bottom: 0.5rem; font-weight: 500; }
      input, textarea { width: 100%; padding: 0.5rem; margin-bottom: 1rem; border: 1px solid #ddd; border-radius: 4px; font-family: inherit; }
      button { background: #7c3aed; color: white; padding: 0.75rem 1.5rem; border: none; border-radius: 4px; cursor: pointer; font-weight: 500; }
      button:hover { background: #6d28d9; }
    </style>
  </head>
  <body>
    <header>
      <nav>
        <a href="/">Calculator</a>
        <a href="/blog/">Blog</a>
        <a href="/about/">About</a>
      </nav>
    </header>
    <main>
      <h1>Contact Us</h1>
      <p>Email: <a href="mailto:info@example.com">info@example.com</a></p>
      <p>Phone: +1-555-555-5555</p>
      <p>Address: 123 Finance St, City, Country</p>
      <h2>Send a message</h2>
      <form action="#" method="post">
        <label>Name<br><input name="name" type="text" required /></label>
        <label>Email<br><input name="email" type="email" required /></label>
        <label>Message<br><textarea name="message" rows="6" required></textarea></label>
        <button type="submit">Send</button>
      </form>
    </main>
  </body>
</html>
