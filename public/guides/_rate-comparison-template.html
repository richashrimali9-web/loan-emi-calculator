<!-- Reusable rate comparison template for editors. Copy into guides where needed. -->
<div style="background:#fff;border:1px solid #e5e7eb;padding:1rem;border-radius:8px;margin:1rem 0;">
  <h3 style="margin-bottom:0.5rem;color:#111827">Rate Comparison Template</h3>
  <p style="margin-bottom:0.75rem;color:#6b7280">Update rates and fees before publishing. Source links: bank rate cards, RBI circulars.</p>
  <table style="width:100%;border-collapse:collapse;">
    <thead>
      <tr style="background:#f3f4f6;text-align:left;">
        <th style="padding:0.5rem;border:1px solid #e5e7eb;">Bank</th>
        <th style="padding:0.5rem;border:1px solid #e5e7eb;text-align:right;">Floating Rate (p.a.)</th>
        <th style="padding:0.5rem;border:1px solid #e5e7eb;text-align:right;">Processing Fee</th>
        <th style="padding:0.5rem;border:1px solid #e5e7eb;">Notes / Source</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td style="padding:0.5rem;border:1px solid #e5e7eb;">[Bank A]</td>
        <td style="padding:0.5rem;border:1px solid #e5e7eb;text-align:right;">[x.xx%]</td>
        <td style="padding:0.5rem;border:1px solid #e5e7eb;text-align:right;">[?]</td>
        <td style="padding:0.5rem;border:1px solid #e5e7eb;">[Link to bank rate card / notes]</td>
      </tr>
      <tr>
        <td style="padding:0.5rem;border:1px solid #e5e7eb;">[Bank B]</td>
        <td style="padding:0.5rem;border:1px solid #e5e7eb;text-align:right;">[x.xx%]</td>
        <td style="padding:0.5rem;border:1px solid #e5e7eb;text-align:right;">[?]</td>
        <td style="padding:0.5rem;border:1px solid #e5e7eb;">[Link to bank rate card / notes]</td>
      </tr>
    </tbody>
  </table>
</div>
